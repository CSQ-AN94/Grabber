[connections]
# 机械臂连接配置
arm_ip = 192.168.1.18
arm_port = 8080

[arm]
# 扫描/观测姿态（6关节角度，单位:度，逗号分隔）
scanning_pose = 90,60,-60,0,-90,-180
# 零位姿态
zero_pose = 0,0,0,0,0,0
# 放置区姿态
dropoff_pose = 135,-30,-120,0,45,-180
# 结算区扫描姿态
checkout_scan_pose = 0,0,0,0,0,0

[gripper]
# 找零速度
zero_speed = 25600
# 初始速度
init_speed = 51200
# 运行速度
run_speed = 51200

[rail]
port = /dev/ttyUSB0
home_position = 0.0
scan_start = 0.0
scan_end = 1.0
scan_speed = 0.1

[calibration]
# 手眼标定矩阵，机械臂末端到相机坐标系的变换矩阵
T_end_to_camera = [[0.2661675272507017, 0.8547838513274552, 0.44553273162254886, -0.17027671778917117], 
[-0.955586518069281, 0.2946582728224868, 0.0055595630670874875, -0.14730433567374931], 
[-0.12652768045560192, -0.42722484685124784, 0.8952483880529766, 0.26902489878144253], 
[0.0, 0.0, 0.0, 1.0]]