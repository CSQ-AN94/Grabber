# Grabber机器人配置文件
# 单位说明：
# - 距离/位置：米(m)
# - 角度：弧度(rad)  
# - 速度：关节速度单位
# - 夹爪张开度：0.0=完全闭合，1.0=完全张开
# - 价格：元(￥)

# 硬件连接配置
connections:
  arm_ip: "192.168.1.18"
  arm_port: 8080

# 机械臂配置 - 关节角度单位：度(deg)
arm:
  home_pose: [90, 90, -90, 0, -90, -180]
  scanning_pose: [90, 90, -60, 0, -120, -180]  
  zero_pose: [0, 0, 0, 0, 0, 0]
  dropoff_pose: [0, 0, 0, 0, 0, 0]  # 默认值
  checkout_scan_pose: [160, 6.5, -62, 5.5, -92, -180]

  # 笛卡尔坐标位姿 - 单位：米(m)和弧度(rad)
  scanning_pose_cartesian: [0.000000, -0.077722, 0.578500, 1.570590, 1.570593, 3.141590]
  zero_pose_cartesian: [0.000030, 0.000000, 0.850500, 0.000000, 0.000000, -3.141185]
  dropoff_pose_cartesian: [-0.487753, 0.085994, 0.129552, -3.141185, 1.501000, -0.175000]
  checkout_scan_pose_cartesian: [0.000030, 0.000000, 0.850500, 0.000000, 0.000000, -3.141185]
  lower_grasp_pose_cartesian: [-0.013926, 0.105030, 0.426080, -3.111000, 1.091997, -1.552000]

# 夹爪配置
gripper:
  zero_speed: 25600
  init_speed: 51200
  run_speed: 51200

# UGV移动底盘配置
ugv:
  max_dist: 1.0  # 最大移动距离，单位：米(m)
  speed: 0.1     # 移动速度，单位：米/秒(m/s)

# 手眼标定配置 - 4x4变换矩阵
calibration:
  # T_end_to_camera: 机械臂末端到相机的变换矩阵
  T_end_to_camera:
    - [-0.009793086512436489, 0.3431101026187897, -0.9392441391552483, -0.035945966640493675]
    - [-0.9653703678406427, 0.24163975833477247, 0.09833758227216649, -0.05168278792973131]
    - [0.2606993447475122, 0.907681488559085, 0.328861926916725, -0.026978015886304548]
    - [0.0, 0.0, 0.0, 1.0]

# 语音合成配置 - iFlytek WebAPI
speech:
  app_id: "aeb60378"
  api_key: "e248b59b7b21d7291702b7808ba07257"
  api_secret: "MjQ1ZmM3MjkwNmEzZTQyN2ZiNTYxN2Ey"

# 大语言模型配置 - 支持多个提供商
llm:
  # Google Gemini
  # gemini_api_key: "AIzaSyDoRYk_kU61IIeEsCuAUaRft2iaeKXtoFE"
  gemini_api_key: "AIzaSyAtCZCLxeRyRXK7dZAEnx0ydS_90VTcHxw"
  model_name: "gemini-2.5-flash-lite"

# 计算机视觉配置
vision:
