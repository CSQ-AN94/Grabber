# 系统配置
system:
  debug_mode: false
  environment: "development"

# 物品抓取和价格配置
# z_offset: 相对于检测中心的Z轴偏移，单位：米(m)，正值向上，负值向下
# roll/pitch/yaw: 抓取姿态，单位：弧度(rad)，遵循move_to_cartesian_pose()的角度约定
# gripper_openness: 夹爪张开度，0.0=完全闭合，1.0=完全张开
# price: 物品价格，单位：元(￥)
