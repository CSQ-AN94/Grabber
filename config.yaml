# Grabber机器人配置文件（双臂 Realman 版本）
# 单位说明：
# - 距离/位置：米(m)
# - 角度：弧度(rad)，关节角度：度(deg)
# - 速度：关节速度百分比
# - 夹爪开度：0.0=完全闭合，1.0=完全张开

# 硬件连接配置（双臂）
connections:
  left_arm_ip: "169.254.128.18"
  right_arm_ip: "169.254.128.19"
  arm_port: 8080
  active_arm: "right"   # 当前用于抓取的手臂，"left" 或 "right"

# 机械臂配置 - 关节角度单位：度(deg)，7个关节
# !! 以下位姿为占位值，需在双臂机器人上重新标定 !!
arm:
  home_pose:          [0, 0, 0, 0, 0, 0, 0]
  scanning_pose:      [0, 0, 0, 0, 0, 0, 0]
  zero_pose:          [0, 0, 0, 0, 0, 0, 0]
  dropoff_pose:       [0, 0, 0, 0, 0, 0, 0]
  checkout_scan_pose: [0, 0, 0, 0, 0, 0, 0]

  # 笛卡尔坐标位姿 - 单位：米(m)和弧度(rad)，[x, y, z, rx, ry, rz]
  # !! 以下为占位值，需在双臂机器人上重新标定 !!
  scanning_pose_cartesian:     [0.3, 0.0, 0.5, 0.0, 1.571, 0.0]
  zero_pose_cartesian:         [0.0, 0.0, 0.8, 0.0, 0.0, 0.0]
  dropoff_pose_cartesian:      [0.0, 0.4, 0.4, 0.0, 1.571, 0.0]
  checkout_scan_pose_cartesian: [0.0, 0.0, 0.8, 0.0, 0.0, 0.0]
  lower_grasp_pose_cartesian:  [0.3, 0.1, 0.3, 0.0, 1.571, 0.0]

# 夹爪配置（Realman Plus 内置夹爪，JSON 指令控制，不再走 Modbus RTU）
gripper:
  open_time: 2.0   # 从全闭到全开所需时间（秒），用于动作后 sleep 等待

# UGV移动底盘配置
ugv:
  max_dist: 1.0
  speed: 0.1

# 手眼标定配置 - 4x4变换矩阵 T_end_to_camera
# !! 以下为占位值（腕部相机eye-in-hand用，还没做），更换相机后必须重新手眼标定 !!
calibration:
  T_end_to_camera:
    - [ 1.0,  0.0,  0.0, -0.05]
    - [ 0.0,  1.0,  0.0,  0.00]
    - [ 0.0,  0.0,  1.0, -0.08]
    - [ 0.0,  0.0,  0.0,  1.0 ]

  # 头部相机(base_0) eye-to-hand 真实标定结果，2026-07-08 用
  # scripts/run_eye_to_hand_calibration.py 实测标定，13/13姿态成功检测棋盘格，
  # 且通过了自洽性验证（平移两两差异 max=9.3mm/mean=4.7mm，旋转两两差异
  # max=1.09deg/mean=0.47deg，达到"一致性良好"标准）——这是第一次真正可信的结果，
  # 之前几次因为标定板从夹爪上掉落重装、位置偏移，标出来的都被自洽性检查拒绝了。
  # 前提：头部舵机固定在 scripts/head_position_lock.py 的 HEAD_REFERENCE
  # (angle1=398, angle2=516)，标左臂那轮之前不能再动头部。
  # 还没接入 utils/config.py 的 CalibrationConfig 解析，暂时只是存档，
  # 后续接检测流程时需要加对应字段。
  T_base_right_to_camera_head:
    - [ 0.999138,  0.003109, -0.041406, -0.097559]
    - [ 0.038865, -0.421035,  0.906212,  0.108447]
    - [-0.014616, -0.907039, -0.420792,  0.199437]
    - [ 0.0,       0.0,       0.0,       1.0]

