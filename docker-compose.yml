services:
  grabber_dev:
    image: grabber_image
    build:
      context: . 
      dockerfile: Dockerfile 
      args: # 设置构建时需要的代理参数
        http_proxy: "http://172.17.0.1:7897"
        https_proxy: "http://172.17.0.1:7897"
    privileged: true  # 需要访问网络接口和CAN设备
    
    container_name: grabber_container
    devices:
      - /dev/bus/usb:/dev/bus/usb
      - /dev/snd:/dev/snd # 挂载声卡
      # CAN设备通过SocketCAN网络接口访问，不需要/dev设备挂载

    # 挂载卷
    volumes:
      - .:/app
      - /tmp/.X11-unix:/tmp/.X11-unix:rw # 挂载X11 socket
      - ~/.Xauthority:/root/.Xauthority:ro # 挂载X11授权文件
      # 音频系统挂载
      - /run/user/1000/pulse:/run/user/1000/pulse:rw # 挂载PulseAudio socket
      - /run/user/1000:/run/user/1000:rw # 挂载用户运行时目录
      - ~/.config/pulse:/root/.config/pulse:rw # 挂载PulseAudio用户配置
      - /usr/share/alsa/pulse-alsa.conf:/root/.asoundrc:ro # 挂载Host的PulseAudio-ALSA配置
      
    # 这里定义容器运行时的环境变量
    environment:
      - http_proxy=http://172.17.0.1:7897
      - https_proxy=http://172.17.0.1:7897
      - no_proxy=localhost,127.0.0.1
      - DISPLAY=${DISPLAY}
      - XAUTHORITY=/root/.Xauthority
      - QT_X11_NO_MITSHM=1
      - NVIDIA_DRIVER_CAPABILITIES=all
      - NVIDIA_VISIBLE_DEVICES=all
      - NO_AT_BRIDGE=1 # 禁用AT-Bridge
      # 音频系统环境变量 - 修复音频配置
      - PULSE_RUNTIME_PATH=/run/user/1000/pulse
      - PULSE_SERVER=unix:/run/user/1000/pulse/native
      - XDG_RUNTIME_DIR=/run/user/1000

    # 设置网络模式为host
    network_mode: "host"

    # 让容器可以访问GPU
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    
    # 使用 command 指令确保容器在 up 之后保持运行
    command: tail -f /dev/null
    
    # 让容器保持运行
    stdin_open: true
    # 交互式终端
    tty: true